<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ece9;--panel:#fafbfa;--ink:#10201f;--muted:#5d7270;--line:#cfdad7;--accent:#0b7a75;--on:#fff;--hl:#ffd166;--hlk:#10201f;--glow:rgba(11,122,117,.3);--fs:21px;--sans:'Figtree',system-ui,sans-serif;--serif:'Literata',Georgia,serif;--disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0a1211;--panel:#111c1b;--ink:#e3efec;--muted:#86a09c;--line:#223533;--accent:#3fd0c4;--on:#062321;--hl:#6b5316;--hlk:#fff0c2;--glow:rgba(63,208,196,.28)}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:40px;cursor:pointer;transition:transform .12s,box-shadow .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px -6px var(--glow)}
button:active:not(:disabled){transform:scale(.95);box-shadow:none}button:disabled{opacity:.4;cursor:default}
.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700;box-shadow:0 6px 16px -6px var(--glow)}
select,input[type=number],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:40px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:relative;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on);flex:none}
h1{font:800 20px/1 var(--disp);letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rp{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--hl));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hide{display:none!important}
#lib{flex:1;overflow:auto;padding:32px 24px 56px;scroll-behavior:smooth}
.wrap{max-width:1200px;margin:0 auto}
#libTop{display:flex;align-items:flex-end;flex-wrap:wrap;gap:16px 20px;margin:0 auto 18px;max-width:1200px}
#libTop h2{font:800 36px/1 var(--disp);letter-spacing:-.025em;margin:0}
#stats{margin:8px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:10px;margin-left:auto;flex:1;justify-content:flex-end;min-width:260px}
.srch{position:relative;flex:1;max-width:340px}.srch svg{position:absolute;left:12px;top:11px;color:var(--muted);pointer-events:none}
.srch input{width:100%;padding-left:38px}
input[type=search]::-webkit-search-cancel-button{cursor:pointer}
#chips{display:flex;flex-wrap:wrap;gap:8px;max-width:1200px;margin:0 auto 26px}
.chip{min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);background:transparent}
.chip b{font-weight:700;margin-left:4px;opacity:.7}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true]:hover:not(:disabled){box-shadow:none}
#resume{max-width:1200px;margin:0 auto 34px}
.hero{display:flex;gap:22px;align-items:center;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 14px 30px -20px rgba(0,0,0,.5);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .25s}
.hero::after{content:'';position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.hero:hover,.hero:focus-visible{transform:translateY(-3px);border-color:var(--accent)}
.hero img{width:96px;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:4px 8px 8px 4px;background:#fff;box-shadow:0 10px 20px -10px rgba(0,0,0,.6);flex:none}
.hero .hi{flex:1;min-width:0;position:relative;z-index:1}
.eyebrow{font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.hero h3{font:800 24px/1.15 var(--disp);letter-spacing:-.01em;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero .bar2{max-width:360px;height:6px;margin:12px 0 0}
.hero .pri{position:relative;z-index:1;flex:none;min-height:46px;padding:0 20px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:28px 22px;max-width:1200px;margin:0 auto}
.card{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:5px 14px 14px 5px;overflow:hidden;cursor:pointer;box-shadow:0 10px 22px -14px rgba(0,0,0,.5);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .2s}
.card::before{content:'';position:absolute;z-index:1;left:0;top:0;bottom:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 60%,transparent);pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-8px) rotate(-.8deg);border-color:var(--accent);box-shadow:0 24px 34px -18px rgba(0,0,0,.55)}
.card .cv{position:relative;background:#fff}
.card img,.card .ph{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;background:#fff;display:block}
.card .ph{display:grid;place-items:center;color:#9aa;background:linear-gradient(135deg,#eef3f1,#dfe8e5)}
.badge{position:absolute;z-index:2;left:14px;bottom:10px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font:700 12px/1.2 var(--sans);background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.badge.new{background:var(--hl);color:var(--hlk);border-color:transparent}
.badge.done{background:var(--accent);color:var(--on);border-color:transparent}
.badge svg{width:13px;height:13px}
.card .m{padding:12px 14px 14px}
.card b.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 15px/1.3 var(--disp);word-break:break-word}
.card small{display:block;color:var(--muted);margin-top:4px;font-size:13px}
.bar2{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--hl));border-radius:3px}
.card .x{position:absolute;z-index:3;top:10px;right:10px;width:34px;min-height:34px;padding:0;border-radius:10px;opacity:0;transform:translateY(-4px);background:var(--panel)}
.card .x:hover:not(:disabled){border-color:#d4495b;color:#d4495b}
.card:hover .x,.card:focus-within .x{opacity:1;transform:none}
#drop{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:24px;border:2px dashed var(--line);border-radius:14px;aspect-ratio:3/4;color:var(--muted);font:600 16px/1.4 var(--disp);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
#drop span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
#drop small{font:400 13px var(--sans)}
#drop:hover,#drop:focus-visible{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
#empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
#empty b{display:block;font:800 22px var(--disp);color:var(--ink);margin-bottom:6px}
.in{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
#ov{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px)}
.dragging #ov{display:grid}#ov div{font:800 30px var(--disp);padding:56px 72px;border:3px dashed var(--accent);border-radius:24px;color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03);opacity:.8}}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}main.solo{grid-template-columns:minmax(0,1fr)}main.solo #viewer{display:none}
section{min-height:0;display:flex;flex-direction:column}#viewer{border-right:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.bar .sp{flex:1}
.bar input[type=number]{width:68px;text-align:center}.bar label{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.scroll{flex:1;min-height:0;overflow:auto}
#vs{padding:20px;display:flex;justify-content:center;align-items:flex-start}
canvas{background:#fff;border-radius:3px;box-shadow:0 14px 34px -12px rgba(0,0,0,.5)}
canvas.turn{animation:turn .3s cubic-bezier(.2,.8,.2,1)}@keyframes turn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
#text{max-width:66ch;margin:0 auto;padding:32px 26px 72px;font:var(--fs)/1.8 var(--serif)}
#text p{margin:0 0 1.15em;animation:rise .35s ease-out both}
#text span{cursor:pointer;border-radius:5px;padding:1px 0;transition:background .25s,box-shadow .25s}
#text span:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
#text span.now{background:var(--hl);color:var(--hlk);box-shadow:-5px 0 0 var(--hl),5px 0 0 var(--hl);-webkit-box-decoration-break:clone;box-decoration-break:clone}
#text .note{font:16px var(--sans);color:var(--muted)}
.sk{height:15px;border-radius:8px;margin:0 0 16px;background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 35%,transparent) 50%,var(--line) 75%);background-size:300% 100%;animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-300% 0}}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:16px}.eq i{width:3px;height:5px;background:currentColor;border-radius:2px;animation:eq .8s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{50%{height:16px}}
#status{padding:11px 16px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;min-height:44px}
#status.busy::before{content:'';display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
#prog{height:3px;background:var(--line)}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--hl));transition:width .25s}
#np{position:fixed;z-index:8;right:0;bottom:0;top:60px;width:min(380px,100%);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-18px 0 40px -24px rgba(0,0,0,.55);transform:translateX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#np.hide{display:flex!important;transform:translateX(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.nh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.nh h2{font:800 20px/1 var(--disp);margin:0;flex:1}
.nb{padding:14px 16px;border-bottom:1px solid var(--line)}
.nb label{display:flex;justify-content:space-between;font:700 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.nb label span{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
#nta{width:100%;min-height:130px;resize:vertical;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font:16px/1.55 var(--sans);color:var(--ink)}
#nta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
#nl{flex:1;overflow:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.ni{display:block;text-align:left;width:100%;padding:10px 12px;border-radius:12px;min-height:0;align-items:flex-start;flex-direction:column;gap:3px}
.ni.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.ni b{font:700 12px var(--sans);color:var(--accent)}.ni span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.nz{color:var(--muted);font-size:14px;padding:18px 6px;text-align:center}
.nf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
#notesBtn .cnt{min-width:20px;padding:0 6px;border-radius:999px;background:var(--on);color:var(--accent);font-size:12px;line-height:20px;text-align:center}
.card .x.rn{right:50px}.card .x.rn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.card .x.fv{right:auto;left:16px}.card .x.fv:hover:not(:disabled){border-color:#e0a100;color:#e0a100}
.card .x.fv.on{opacity:1;transform:none;color:#e0a100;border-color:color-mix(in srgb,#e0a100 55%,var(--line))}
[aria-pressed=true] .st path,.st.on path{fill:currentColor}
.rin{width:100%;min-height:34px;padding:0 8px;border-radius:8px;font:600 15px/1.3 var(--disp)}
.ib{width:40px;padding:0}.ib[aria-pressed=true]{color:#e0a100;border-color:#e0a100}.ib[aria-pressed=true] svg path{fill:currentColor}
#bm[aria-pressed=true]{background:var(--hl);color:var(--hlk);border-color:var(--hl)}#bm[aria-pressed=true] svg path{fill:currentColor}
.tabs{display:flex;gap:6px;flex:1}.tabs button{min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.bi{display:flex;gap:6px;align-items:stretch}.bi .ni{flex:1}.bi .bx{width:38px;padding:0;flex:none;min-height:0;border-radius:12px}
#streak{max-width:1200px;margin:0 auto 22px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 34px;padding:16px 22px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.stk-n{display:flex;align-items:center;gap:12px}
.stk-f{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,#ff8a3d 18%,transparent);color:#e8681a}.stk-f svg{width:26px;height:26px;fill:currentColor}
.stk-f.off{background:var(--bg);color:var(--muted)}.stk-f.off svg{fill:none}
.stk-n b{display:block;font:800 34px/1 var(--disp);letter-spacing:-.02em}.stk-n small{color:var(--muted);font-size:13px}
.stk-w{display:flex;gap:10px}
.stk-d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.stk-d i{position:relative;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.stk-d i::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--panel)}
.stk-d.met i{background:var(--accent)}.stk-d.met i::after{display:none}
.stk-d i svg{position:relative;z-index:1;width:16px;height:16px;color:var(--on);display:none}.stk-d.met i svg{display:block}
.stk-d.today span{color:var(--ink);font-weight:700}
.stk-r{margin-left:auto;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);align-items:flex-end}.stk-r p{margin:0}.stk-r b{color:var(--ink)}
.stk-r label{display:inline-flex;align-items:center;gap:8px;font-size:13px}.stk-r select{min-height:32px;font-size:13px}
.skchip{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font:700 14px var(--sans);flex:none}
.skchip svg{width:16px;height:16px}.skchip.on{color:#e8681a;border-color:#e8681a;background:color-mix(in srgb,#ff8a3d 14%,transparent)}.skchip.on svg{fill:currentColor}
.skchip.pop{animation:pulse .7s ease 2}
@media(max-width:860px){.stk-r{margin-left:0;align-items:flex-start}.stk-w{gap:7px}}
@media(hover:none){.card .x{opacity:1;transform:none}}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,42%) minmax(0,58%)}main.solo{grid-template-rows:1fr}#viewer{border-right:0;border-bottom:1px solid var(--line)}#libTop h2{font-size:28px}.tools{min-width:100%;margin-left:0;justify-content:stretch}.srch{max-width:none}.hero{flex-wrap:wrap}.hero img{width:72px}.hero h3{font-size:20px}.hero .pri{width:100%}}
#stage{display:none;position:relative;flex:1;min-height:0;background:#000;overflow:hidden}#viewer.vis>.bar,#viewer.vis>.scroll{display:none}#viewer.vis #stage{display:block}
#vmd{position:absolute;top:12px;right:60px;min-height:40px;padding:0 14px;background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px);font-weight:700}#vc{display:block;position:absolute;inset:0}#vfs{position:absolute;top:12px;right:12px;width:40px;padding:0;background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px)}
#tags{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}#tags i{font:700 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px);font-style:normal}
#cap{position:absolute;left:0;right:0;bottom:0;padding:48px 7% 24px;color:#fff;font:600 clamp(16px,2.1vw,26px)/1.45 var(--serif);text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.8);background:linear-gradient(transparent,rgba(0,0,0,.72))}
#cap.in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}#cap mark{background:none;color:var(--hl);border-bottom:2px solid currentColor}#vis[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- library polish ---------- */
#lib{background:radial-gradient(900px 420px at 12% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),radial-gradient(700px 380px at 95% 0,color-mix(in srgb,var(--hl) 22%,transparent),transparent 70%),var(--bg);padding:44px 28px 80px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#libTop{align-items:center;margin-bottom:22px}
#libTop h2{font-size:clamp(32px,5vw,48px);letter-spacing:-.035em;background:linear-gradient(100deg,var(--ink) 40%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
#stats{margin-top:10px;font-size:14px;font-weight:500;letter-spacing:.01em}
.tools{gap:12px}
.srch{max-width:380px}.srch svg{top:13px;left:15px}
.srch input{min-height:44px;border-radius:999px;padding-left:42px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
#sort{min-height:44px;border-radius:999px;padding:0 16px;cursor:pointer;background-color:color-mix(in srgb,var(--panel) 88%,transparent);box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
#chips{gap:6px;padding:5px;width:max-content;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(8px);margin-bottom:30px;scrollbar-width:none}
.chip{border:0;min-height:34px;white-space:nowrap}
.chip:hover:not(:disabled){transform:none;box-shadow:none;color:var(--ink)}
.chip b{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--muted) 18%,transparent);font-size:12px;opacity:1}
.chip[aria-pressed=true]{box-shadow:0 6px 14px -6px rgba(0,0,0,.45)}
.chip[aria-pressed=true] b{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.hero{padding:22px 26px;gap:28px;border-radius:26px;background:linear-gradient(120deg,var(--panel) 45%,color-mix(in srgb,var(--accent) 14%,var(--panel)));box-shadow:0 24px 50px -28px rgba(0,0,0,.55)}
.hero img{width:112px;border-radius:5px 10px 10px 5px;transform:rotate(-3deg);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.hero:hover img{transform:rotate(0) scale(1.05)}
.hero h3{font-size:clamp(22px,3vw,30px)}
.hero .bar2{height:8px;max-width:420px}
.hero .pri{border-radius:999px;min-height:48px;padding:0 24px}
#grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:34px 26px}
.card{border-radius:6px 16px 16px 6px;border-color:color-mix(in srgb,var(--line) 70%,transparent);background:var(--panel);box-shadow:0 2px 4px rgba(0,0,0,.08),0 18px 28px -18px rgba(0,0,0,.55)}
.card::before{width:12px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.18) 35%,rgba(0,0,0,.06) 70%,transparent)}
.card .cv::after{content:'';position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.5));pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-10px) rotate(-1deg) scale(1.02);box-shadow:0 4px 8px rgba(0,0,0,.1),0 34px 44px -20px rgba(0,0,0,.6)}
.badge{left:16px;bottom:12px;backdrop-filter:blur(6px);background:color-mix(in srgb,var(--panel) 85%,transparent)}
.badge.new{background:var(--hl)}.badge.done{background:var(--accent)}
.card .m{padding:14px 16px 16px}
.card b.t{font-size:15px;letter-spacing:-.005em}
.card small{font-size:12.5px;margin-top:5px}
.card .bar2{height:4px}
.card .x{border-radius:50%;backdrop-filter:blur(6px)}
#drop{border-radius:6px 16px 16px 6px;border:2px dashed color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--panel) 55%,transparent)}
#drop span{width:54px;height:54px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#drop:hover span{transform:scale(1.12) rotate(90deg)}
#empty{padding:64px 0;font-size:15px}
@media(max-width:640px){#lib{padding:28px 16px 64px}#grid{grid-template-columns:repeat(2,1fr);gap:26px 16px}.hero{flex-direction:column;align-items:flex-start;gap:16px}.hero .pri{width:100%}.tools{min-width:100%;margin-left:0}.srch{max-width:none}}
@media(prefers-reduced-motion:reduce){.card,.hero,.hero img,#drop span{transition:none!important}.card:hover,.card:focus-visible{transform:none}}
</style>
</head>
<body>
<header>
  <span class="logo" id="logo"></span>
  <button id="home" class="hide">&#8592; Library</button>
  <h1 id="title">PDF Reader</h1>
  <span id="skChip" class="skchip hide" role="status"></span>
  <button id="renBtn" class="ib hide" aria-label="Rename book" title="Rename book"></button>
  <button id="favBtn" class="ib hide" aria-pressed="false" aria-label="Favorite" title="Favorite"></button>
  <button id="mode" class="hide">Text only</button>
  <button id="vis" class="hide" aria-pressed="false" title="Visual story mode (V)">Visuals</button>
  <button class="pri" id="add">Add PDF</button>
  <button class="pri hide" id="notesBtn" aria-expanded="false" aria-controls="np"></button>
  <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
  <div id="rp"></div>
</header>
<div id="ov"><div>Drop PDFs to add them</div></div>

<div id="lib">
  <div id="libTop">
    <div><h2>Your library</h2><p id="stats"></p></div>
    <div class="tools">
      <div class="srch"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search your library" aria-label="Search your library"></div>
      <select id="sort" aria-label="Sort library"><option value="recent">Recently read</option><option value="added">Recently added</option><option value="title">Title A–Z</option><option value="progress">Most progress</option></select>
    </div>
  </div>
  <div id="streak" aria-label="Reading streak"></div>
  <div id="chips" role="group" aria-label="Filter library"></div>
  <div id="resume"></div>
  <div id="grid"></div>
</div>

<aside id="np" class="hide" aria-label="Notes">
  <div class="nh"><div class="tabs"><button id="tN" aria-pressed="true">Notes</button><button id="tB" aria-pressed="false">Bookmarks</button></div><button id="nclose" aria-label="Close panel">&times;</button></div>
  <div class="pane" id="pN">
  <div class="nb"><label for="nta">Page <em id="npg" style="font-style:normal">1</em><span id="nsave">Saved automatically</span></label>
    <textarea id="nta" placeholder="Write a note for this page…"></textarea></div>
  <div id="nl"></div>
  <div class="nf"><button id="nexp" style="flex:1">Save notes .txt</button></div>
  </div>
  <div class="pane hide" id="pB"><div id="bl" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px"></div></div>
</aside>

<main id="app" class="hide">
  <section id="viewer">
    <div class="bar">
      <button id="prev" aria-label="Previous page">&#8592;</button>
      <input type="number" id="pg" min="1" value="1" aria-label="Page number"><span id="total"></span>
      <button id="next" aria-label="Next page">&#8594;</button><button id="bm" class="ib" aria-pressed="false" aria-label="Bookmark this page" title="Bookmark this page (B)"></button><span class="sp"></span>
      <button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit">Fit</button><button id="zin" aria-label="Zoom in">+</button>
    </div>
    <div class="scroll" id="vsw"><div id="vs"><canvas id="cv"></canvas></div></div>
    <div id="stage"><canvas id="vc"></canvas><div id="tags"></div><button id="vfs" aria-label="Fullscreen" title="Fullscreen">&#9974;</button><button id="vmd" title="Auto / Story / Explain">Auto</button><div id="cap" aria-hidden="true"></div></div>
  </section>
  <section>
    <div class="bar">
      <button class="pri" id="play"></button><button id="stop"></button>
      <label>Speed <select id="rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      <select id="voice" aria-label="Voice" style="flex:1;min-width:150px"></select>
    </div>
    <div class="bar">
      <button id="fsm" aria-label="Smaller text">A&minus;</button><button id="fsp" aria-label="Larger text">A+</button>
      <label>Scan language <select id="lang"><option value="eng">English</option><option value="spa">Spanish</option><option value="fra">French</option><option value="deu">German</option><option value="ita">Italian</option><option value="por">Portuguese</option></select></label>
      <label><input type="checkbox" id="clean" checked> Skip headers &amp; page numbers</label><span class="sp"></span><button id="ocrPage">Scan page</button><button id="scanAll">Scan all</button><button id="save">Save .txt</button>
    </div>
    <div id="prog"><i></i></div>
    <div class="scroll"><article id="text" aria-live="polite"></article></div>
    <div id="status" role="status">Ready.</div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id), synth=window.speechSynthesis;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const S={doc:null,pdf:null,page:null,n:1,zoom:1,texts:{},fly:{},ch:{},run:0,gen:0,reading:false,paused:false,tok:0,task:null,scanning:false,ac:new Map()};
const status=t=>{$('status').textContent=t;$('status').classList.toggle('busy',/…|%/.test(t))}, progress=f=>$('prog').firstElementChild.style.width=Math.round(f*100)+'%';
const ic=d=>'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const IC={l:ic('<path d="M15 6l-6 6 6 6"/>'),r:ic('<path d="M9 6l6 6-6 6"/>'),pl:ic('<path d="M12 5v14M5 12h14"/>'),mi:ic('<path d="M5 12h14"/>'),play:ic('<path d="M7 5l12 7-12 7z" fill="currentColor"/>'),stop:ic('<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>'),book:ic('<path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/>')};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};

/* ---------- library storage ---------- */
const dispName=m=>m.title||m.name.replace(/\.pdf$/i,'');
const DB=new Promise((ok,no)=>{const r=indexedDB.open('pdf-reader',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});r.result.createObjectStore('files')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=async(st,mode,fn)=>{const db=await DB;return new Promise((ok,no)=>{const t=db.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
async function updDoc(id,fn){
  const m=await idb('docs','readonly',o=>o.get(id));if(!m)return;fn(m);await idb('docs','readwrite',o=>o.put(m));
  if(S.doc&&S.doc.id===id)fn(S.doc);
}
const persist=debounce(()=>{if(!S.doc)return;S.doc.texts=S.texts;S.doc.page=S.n;S.doc.opened=Date.now();idb('docs','readwrite',o=>o.put(S.doc)).catch(()=>{})},700);

let wk;
function loadPdf(blob){
  wk=wk||fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js').then(r=>r.blob()).then(b=>{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b)}).catch(()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'});
  return wk.then(async()=>pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise);
}
async function thumb(pdf){
  const p=await pdf.getPage(1),vp=p.getViewport({scale:260/p.getViewport({scale:1}).width}),c=document.createElement('canvas');
  c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',.7);
}
async function addFile(f,open){
  if(!/pdf/i.test(f.type+f.name)){status('Not a PDF: '+f.name);return}
  try{
    let m=(await idb('docs','readonly',o=>o.getAll())).find(d=>d.name===f.name&&d.size===f.size);
    if(!m){
      const pdf=await loadPdf(f);
      m={id:crypto.randomUUID(),name:f.name,size:f.size,pages:pdf.numPages,added:Date.now(),opened:Date.now(),page:1,v:3,texts:{},thumb:await thumb(pdf)};
      pdf.destroy();
      await idb('files','readwrite',o=>o.put(f,m.id));await idb('docs','readwrite',o=>o.put(m));
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    }
    if(open)await openDoc(m.id);else renderLib();
  }catch(e){alert('Could not open '+f.name+': '+(e.message||e))}
}
async function openDoc(id){
  const m=await idb('docs','readonly',o=>o.get(id)),blob=await idb('files','readonly',o=>o.get(id));
  stopSpeech();S.scanning=false;if(S.pdf)S.pdf.destroy();
  S.pdf=await loadPdf(blob);S.doc=m;S.hf=null;if(m.v!==3){m.v=3;m.texts={}}S.texts=m.texts||{};m.notes=m.notes||{};m.marks=m.marks||{};S.fly={};S.ch={};S.zoom=1;
  $('title').textContent=dispName(m);$('total').textContent='/ '+S.pdf.numPages;$('pg').max=S.pdf.numPages;
  view('app');
  const bk=Object.keys(m.marks).map(Number).filter(k=>k>=1&&k<=S.pdf.numPages);
  if(bk.length){const bn=bk.reduce((a,b)=>bmT(m.marks[b])>=bmT(m.marks[a])?b:a);showPage(bn,bmI(m.marks[bn]))}
  else showPage(Math.min(m.page||1,S.pdf.numPages));
}
function view(v){
  const app=v==='app';$('lib').classList.toggle('hide',app);$('app').classList.toggle('hide',!app);
  $('home').classList.toggle('hide',!app);$('mode').classList.toggle('hide',!app);$('vis').classList.toggle('hide',!app);if(!app&&V.on)V.toggle(false);$('renBtn').classList.toggle('hide',!app);$('favBtn').classList.toggle('hide',!app);$('skChip').classList.toggle('hide',!app);if(app)skChip();$('add').classList.toggle('hide',app);$('notesBtn').classList.toggle('hide',!app);if(!app)noteOpen(false);
  if(!app){$('title').textContent='PDF Reader';$('rp').style.width=0;renderLib(1)}
}
const FILTERS=[['all','All'],['fav','Favorites'],['reading','In progress'],['new','Not started'],['done','Finished']];
const stateOf=m=>m.page>=m.pages&&m.pages>1?'done':m.page<=1?'new':'reading';
const ago=t=>{const d=(Date.now()-t)/1000;if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+' min ago';if(d<86400)return Math.floor(d/3600)+' h ago';if(d<604800)return Math.floor(d/86400)+' d ago';return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
const pct=m=>Math.round(Math.min(1,m.page/m.pages)*100);
const SORTS={recent:(a,b)=>b.opened-a.opened,added:(a,b)=>(b.added||0)-(a.added||0),title:(a,b)=>dispName(a).localeCompare(dispName(b),undefined,{numeric:true,sensitivity:'base'}),progress:(a,b)=>pct(b)-pct(a)||b.opened-a.opened};
const IX={x:ic('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>'),ok:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),doc:ic('<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>')};
let libFilter=ls.get('pr-filter')||'all';
const STAR=ic('<path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.5 6.6 20.4l1-6.1L3.2 10l6.1-.9z"/>').replace('<svg ','<svg class="st" ');
const NI=ic('<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>');
function renameDoc(m,t){
  const i=document.createElement('input');i.className='rin';i.value=dispName(m);i.maxLength=200;i.setAttribute('aria-label','Book title');
  let done=false;
  const fin=async ok=>{if(done)return;done=true;if(ok){const v=i.value.trim();await updDoc(m.id,d=>{d.title=v&&v!==d.name.replace(/\.pdf$/i,'')?v:undefined})}renderLib()};
  i.onclick=e=>e.stopPropagation();i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')fin(true);else if(e.key==='Escape')fin(false)};i.onblur=()=>fin(true);
  t.replaceWith(i);i.focus();i.select();
}
async function removeDoc(m){if(confirm('Remove “'+dispName(m)+'” from your library?')){await idb('docs','readwrite',o=>o.delete(m.id));await idb('files','readwrite',o=>o.delete(m.id));renderLib()}}
async function renderLib(anim){
  streakRender();const g=$('grid'),q=$('q').value.trim().toLowerCase(),sort=$('sort').value;g.textContent='';
  let docs=[];try{docs=await idb('docs','readonly',o=>o.getAll())}catch(e){}
  const counts={all:docs.length,fav:0,reading:0,new:0,done:0};docs.forEach(m=>{counts[stateOf(m)]++;if(m.fav)counts.fav++});
  if(!counts[libFilter]&&libFilter!=='all')libFilter='all';
  // chips + stats
  const ch=$('chips');ch.textContent='';
  FILTERS.forEach(([k,t])=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',k===libFilter);b.innerHTML=t+'<b>'+counts[k]+'</b>';b.onclick=()=>{libFilter=k;ls.set('pr-filter',k);renderLib()};ch.appendChild(b)});
  ch.classList.toggle('hide',docs.length<2);
  $('stats').textContent=docs.length?docs.length+(docs.length===1?' document':' documents')+' · '+counts.reading+' in progress · '+counts.done+' finished':'Nothing here yet';
  // resume hero
  const rs=$('resume');rs.textContent='';
  const last=!q&&libFilter==='all'?docs.filter(m=>stateOf(m)==='reading').sort(SORTS.recent)[0]:null;
  if(last){
    const h=document.createElement('div');h.className='hero'+(anim?' in':'');h.tabIndex=0;h.setAttribute('role','button');
    const im=document.createElement('img');im.src=last.thumb;im.alt='';
    const hi=document.createElement('div');hi.className='hi';
    const ey=document.createElement('p');ey.className='eyebrow';ey.textContent='Continue reading';
    const t=document.createElement('h3');t.textContent=dispName(last);
    const s2=document.createElement('p');s2.textContent='Page '+last.page+' of '+last.pages+' · '+pct(last)+'% · opened '+ago(last.opened);
    const pb=document.createElement('div');pb.className='bar2';pb.innerHTML='<i style="width:'+pct(last)+'%"></i>';
    const go=document.createElement('button');go.className='pri';go.innerHTML=IC.play+'Resume';
    hi.append(ey,t,s2,pb);h.append(im,hi,go);h.onclick=()=>openDoc(last.id);h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDoc(last.id)}};rs.appendChild(h);
  }
  // drop tile
  const d=document.createElement('div');d.id='drop';d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Add PDF');
  d.innerHTML='<span>'+IC.pl+'</span>Add a PDF<small>or drop files anywhere</small>';d.onclick=()=>$('file').click();d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
  g.appendChild(d);if(anim)d.classList.add('in');
  const list=docs.filter(m=>(dispName(m)+' '+m.name).toLowerCase().includes(q)&&(libFilter==='all'||(libFilter==='fav'?m.fav:stateOf(m)===libFilter))).sort(SORTS[sort]||SORTS.recent);
  list.forEach((m,ix)=>{
    const st=stateOf(m);
    const c=document.createElement('div');c.className='card'+(anim?' in':'');c.style.setProperty('--d',Math.min(ix+1,12)*45+'ms');c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-label','Open '+dispName(m));
    const cv=document.createElement('div');cv.className='cv';
    if(m.thumb){const im=document.createElement('img');im.src=m.thumb;im.alt='';im.loading='lazy';cv.appendChild(im)}else{const ph=document.createElement('div');ph.className='ph';ph.innerHTML=IX.doc;cv.appendChild(ph)}
    const bd=document.createElement('span');bd.className='badge '+st;
    bd.innerHTML=st==='done'?IX.ok+'Finished':st==='new'?'New':pct(m)+'%';cv.appendChild(bd);
    const mt=document.createElement('div');mt.className='m';
    const t=document.createElement('b');t.className='t';t.textContent=dispName(m);t.title=m.name;
    const s1=document.createElement('small');s1.textContent=m.pages+(m.pages===1?' page':' pages')+(st==='reading'?' · on page '+m.page:'')+(Object.keys(m.marks||{}).length?' · '+Object.keys(m.marks).length+' bookmark'+(Object.keys(m.marks).length>1?'s':''):'');
    const s2=document.createElement('small');s2.textContent=st==='new'&&m.opened===m.added?'Added '+ago(m.added):'Opened '+ago(m.opened);
    const pb=document.createElement('div');pb.className='bar2';pb.innerHTML='<i style="width:'+pct(m)+'%"></i>';
    const x=document.createElement('button');x.className='x';x.innerHTML=IX.x;x.title='Remove from library';x.setAttribute('aria-label','Remove '+dispName(m));
    x.onclick=e=>{e.stopPropagation();removeDoc(m)};
    const rn=document.createElement('button');rn.className='x rn';rn.innerHTML=NI;rn.title='Rename';rn.setAttribute('aria-label','Rename '+dispName(m));
    rn.onclick=e=>{e.stopPropagation();renameDoc(m,t)};
    const fv=document.createElement('button');fv.className='x fv'+(m.fav?' on':'');fv.innerHTML=STAR;fv.title=m.fav?'Remove from favorites':'Add to favorites';fv.setAttribute('aria-pressed',!!m.fav);fv.setAttribute('aria-label',(m.fav?'Unfavorite ':'Favorite ')+dispName(m));
    fv.onclick=async e=>{e.stopPropagation();await updDoc(m.id,d=>{d.fav=!d.fav});renderLib()};
    mt.append(t,s1,s2,pb);c.append(cv,mt,x,rn,fv);c.onclick=()=>openDoc(m.id);
    c.onkeydown=e=>{if(e.target!==c)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();openDoc(m.id)}else if(e.key==='Delete'){removeDoc(m)}};
    g.appendChild(c);
  });
  if(docs.length&&!list.length){const e=document.createElement('div');e.id='empty';e.innerHTML='<b>No matches</b>'+(q?'Nothing matches “'+q.replace(/[<>&]/g,'')+'”.':'No documents in this view.');g.appendChild(e)}
}
$('sort').value=ls.get('pr-sort')||'recent';
$('sort').onchange=()=>{ls.set('pr-sort',$('sort').value);renderLib()};

/* ---------- text extraction & OCR ---------- */
const PN=/^[\s\-–—•·|]*((page|p\.?)\s*)?([0-9]{1,4}|[ivxlcdm]{1,7})(\s*(of|\/)\s*[0-9]{1,4})?[\s\-–—•·|]*$/i;
const norm=t=>t.toLowerCase().replace(/[0-9]+|\b[ivxlcdm]+\b/g,'#').replace(/\s+/g,' ').trim();
const junk=(t,f,hf)=>{
  if(!$('clean').checked||(f>=.12&&f<=.88))return false;
  if(PN.test(t)||(hf&&hf.has(norm(t))))return true;
  return(f<.06||f>.94)&&t.split(' ').length<=8&&!/[.!?,;:]["”’']?$/.test(t);
};
const joinLines=ls=>ls.reduce((a,t)=>/[a-z]-$/.test(a)&&/^[a-z]/.test(t)?a.slice(0,-1)+t:a+' '+t);
async function pageLines(n){
